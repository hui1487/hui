<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080a10">
<meta name="description" content="Подборка полезных Telegram-сервисов в одном месте.">
<title>Сервисы — полезные Telegram-сервисы</title>
<style>
:root{color-scheme:dark;--bg:#120d0a;--text:#fff7ed;--line:rgba(255,221,185,.14)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-2;background:radial-gradient(ellipse at 12% 4%,rgba(224,105,38,.22),transparent 36%),radial-gradient(ellipse at 95% 58%,rgba(170,67,24,.18),transparent 32%),radial-gradient(ellipse at 50% 100%,rgba(111,59,24,.22),transparent 48%),linear-gradient(180deg,#21130d,#120d0a 65%)}
.ambient{position:fixed;width:320px;height:320px;border-radius:50%;filter:blur(100px);opacity:.18;pointer-events:none;z-index:-1;animation:drift 18s ease-in-out infinite alternate}
.ambient.one{background:#e97835;top:-190px;left:-150px}
.ambient.two{background:#a83e1f;right:-190px;bottom:-160px;animation-delay:-7s}

/* LEAVES */
.leaf-rain{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.leaf{
  position:absolute;
  top:-40px;
  left:0;
  width:18px;
  height:18px;
  background:#e8903a;
  border-radius:2px 14px 2px 14px;
  opacity:.9;
  animation-name:fall;
  animation-timing-function:linear;
  animation-iteration-count:infinite;
  animation-fill-mode:both;
  transform:translate3d(0,0,0);
  -webkit-transform:translate3d(0,0,0);
  -webkit-backface-visibility:hidden;
  backface-visibility:hidden;
}
.leaf:nth-child(odd){background:#dbb040;border-radius:14px 2px}
.leaf:nth-child(3n){background:#d06828}
.leaf:nth-child(5n){background:#f0a050}
@keyframes fall{
  0%{-webkit-transform:translate3d(0,0,0) rotate(0deg);transform:translate3d(0,0,0) rotate(0deg);opacity:0}
  5%{opacity:.9}
  100%{-webkit-transform:translate3d(0,110vh,0) rotate(720deg);transform:translate3d(0,110vh,0) rotate(720deg);opacity:0}
}
@-webkit-keyframes fall{
  0%{-webkit-transform:translate3d(0,0,0) rotate(0deg);opacity:0}
  5%{opacity:.9}
  100%{-webkit-transform:translate3d(0,110vh,0) rotate(720deg);opacity:0}
}

.shell{position:relative;z-index:2;width:min(100% - 36px,920px);margin:0 auto;padding:26px 0 48px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 14px;border:1px solid var(--line);border-radius:22px;background:rgba(18,22,34,.68);backdrop-filter:blur(24px);box-shadow:0 12px 40px #0003}
.identity{display:flex;align-items:center;gap:12px;min-width:0}
.avatar{width:56px;height:56px;object-fit:cover;border-radius:18px;border:1px solid #a4afff66;box-shadow:0 0 24px #687aff26}
.identity-copy strong{display:block;font-size:14px;font-weight:800}
.identity-copy span{display:flex;align-items:center;gap:7px;color:#a6b2c8;font-size:12px;margin-top:5px}
.online-dot{width:7px;height:7px;border-radius:50%;background:#5de5a5;box-shadow:0 0 12px #5de5a5}
.top-label{font-size:10px;font-weight:800;letter-spacing:1.7px;color:#ffd1a0;border:1px solid #ffd1a02b;background:#ff9b350d;border-radius:100px;padding:9px 11px;white-space:nowrap}
.hero{padding:72px 8px 38px}
.eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.eyebrow:before{content:"";width:22px;height:1px;background:#f2a65a;box-shadow:0 0 12px #e88a3a}
h1{font-size:clamp(42px,8vw,76px);line-height:.99;letter-spacing:-.065em;font-weight:850;max-width:760px;animation:floatY 7s ease-in-out infinite}
h1 .gradient{background:linear-gradient(100deg,#fff0d8 0%,#ffb56b 42%,#e96b37 90%);background-clip:text;-webkit-background-clip:text;color:transparent}
.hero p{max-width:520px;color:#a2aec2;font-size:15px;line-height:1.8;margin-top:22px;animation:floatY 9s ease-in-out infinite;animation-delay:-2s}
.hero-bottom{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:25px}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:9px 12px;color:#c4cce0;background:#ffffff08;font-size:11px;font-weight:650}
.pill svg{width:14px;height:14px;color:#b6c1ff}
.section-head{margin:18px 8px 16px}
.section-head h2{font-size:13px;letter-spacing:2px;text-transform:uppercase;font-weight:800;color:#e5e9f5}
.services{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.service-card{--accent:#8ca0ff;position:relative;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;min-width:0;min-height:300px;padding:20px;border:1px solid color-mix(in srgb,var(--accent) 33%,transparent);border-radius:25px;background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 15%,#2a1b14),rgba(24,15,11,.96) 75%);box-shadow:0 18px 45px #0002,inset 0 1px #ffffff12;backdrop-filter:blur(22px);transition:transform .28s,border-color .28s,box-shadow .28s}
.service-card.green{--accent:#83d68a}
.service-card.gold{--accent:#ffc66b}
.service-card.blue{
  --accent:#5b9dff;
  background:linear-gradient(145deg,rgba(40,80,160,.25),rgba(12,20,40,.88) 70%);
  border:1px solid rgba(100,170,255,.38);
  backdrop-filter:blur(28px) saturate(1.45);
  -webkit-backdrop-filter:blur(28px) saturate(1.45);
  box-shadow:0 18px 45px rgba(0,40,120,.2),inset 0 1px rgba(180,210,255,.2);
}
.service-card:before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 0 0,color-mix(in srgb,var(--accent) 25%,transparent),transparent 62%)}
.card-head{display:flex;align-items:flex-start}
.service-icon{width:70px;height:70px;flex:0 0 70px;display:grid;place-items:center;overflow:hidden;border:1px solid color-mix(in srgb,var(--accent) 50%,transparent);border-radius:21px;background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 18%,#24170f),#140d09);box-shadow:0 0 25px color-mix(in srgb,var(--accent) 13%,transparent),inset 0 1px #ffffff1c}
.service-icon img{display:block;width:100%;height:100%;object-fit:contain;object-position:center;padding:4px;border-radius:inherit}
.service-card.blue .service-icon{border:1px solid rgba(100,170,255,.5);background:linear-gradient(145deg,rgba(60,120,220,.28),rgba(15,25,50,.92))}
.card-copy{padding:22px 0 20px;flex:1}
.card-copy h3{font-size:23px;font-weight:800;letter-spacing:-.7px;margin-bottom:9px;animation:floatY 8s ease-in-out infinite}
.card-copy p{font-size:13px;line-height:1.65;color:#aab5c9}
.service-link{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:49px;padding:12px 14px;border:1px solid color-mix(in srgb,var(--accent) 48%,transparent);border-radius:15px;background:linear-gradient(110deg,color-mix(in srgb,var(--accent) 30%,#101522),color-mix(in srgb,var(--accent) 16%,#101522));color:#fff;text-decoration:none;font-size:13px;font-weight:800;box-shadow:inset 0 1px #ffffff25,0 8px 22px #0002;transition:transform .2s,filter .2s}
.service-card.blue .service-link{border:1px solid rgba(100,170,255,.48);background:linear-gradient(110deg,rgba(50,110,220,.42),rgba(30,70,160,.28))}
.arrow{display:grid;place-items:center;width:25px;height:25px;flex:0 0 25px;border-radius:9px;background:#ffffff18;font-size:16px}
.footer{margin:25px 7px 0;padding-top:18px;border-top:1px solid #ffdfb31c;color:#a98b73;font-size:11px}

@keyframes drift{to{transform:translate(30px,-20px) scale(1.12)}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

@media(hover:hover){
  .service-card:hover{transform:translateY(-5px);border-color:color-mix(in srgb,var(--accent) 65%,transparent);box-shadow:0 25px 55px #0004}
  .service-link:hover{transform:translateY(-2px);filter:brightness(1.12)}
  .service-link:hover .arrow{transform:translate(2px,-2px)}
}
@media(max-width:760px){
  .shell{width:min(100% - 28px,520px);padding-top:16px}
  .hero{padding:55px 4px 30px}
  .services{grid-template-columns:1fr;gap:13px}
  .service-card{min-height:0;padding:19px;border-radius:23px}
  .card-copy h3{font-size:22px}
  .service-icon{width:66px;height:66px;flex-basis:66px}
  h1,.hero p,.card-copy h3{animation:none}
  .leaf{opacity:.9}
}
@media(max-width:360px){
  .shell{width:calc(100% - 22px)}
  .topbar{padding:10px;border-radius:18px}
  .avatar{width:50px;height:50px}
  .service-icon{width:60px;height:60px;flex-basis:60px;border-radius:17px}
}
@media(prefers-reduced-motion:reduce){
  h1,.hero p,.card-copy h3{animation:none}
  .leaf{opacity:.9}
}
</style>
</head>

    for(var i = 0; i < count; i++){
      var el = document.createElement('div');
      el.className = 'leaf';
      el.style.left = (Math.random() * 100) + '%';
      var s = 11 + Math.random() * 14;
      el.style.width = s + 'px';
      el.style.height = (s * 0.8) + 'px';
      var dur = 9 + Math.random() * 14;
      var delay = -(Math.random() * 20);
      el.style.animationDuration = dur + 's';
      el.style.webkitAnimationDuration = dur + 's';
      el.style.animationDelay = delay + 's';
      el.style.webkitAnimationDelay = delay + 's';
      box.appendChild(el);
    }
  }
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', spawnLeaves);
  } else {
    spawnLeaves();
  }
  // retry once after short delay (helps some mobile browsers)
  setTimeout(spawnLeaves, 300);
})();
