<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>maxim_fsb</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: #0b0f19;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .wrap {
      width: 100%;
      max-width: 380px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding: 0 4px;
      animation: fadeIn 0.5s ease;
    }

    .back {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #1a2233;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8b9cb3;
      font-size: 18px;
      flex-shrink: 0;
      transition: background 0.2s;
    }

    .back:active {
      background: #243044;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      background: #1e293b;
      flex-shrink: 0;
    }

    .header-info h1 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 1px;
    }

    .header-info span {
      font-size: 12px;
      color: #22c55e;
      font-weight: 500;
    }

    /* Card */
    .card {
      background: #141b2d;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 12px;
      animation: slideUp 0.5s ease both;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:nth-child(2) { animation-delay: 0.1s; }
    .card:nth-child(3) { animation-delay: 0.2s; }
    .card:nth-child(4) { animation-delay: 0.3s; }

    .card:active {
      transform: scale(0.98);
    }

    .card-top {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }

    /* Round icons */
    .icon {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      flex-shrink: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b1220;
      border: 1px solid rgba(255,255,255,0.16);
      box-shadow: 0 4px 14px rgba(0,0,0,0.42);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .icon:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 18px rgba(0,0,0,0.5);
    }

    .icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      padding: 3px;
    }

    .icon-virus img { padding: 0; object-fit: cover; }
    .icon-rubup img { padding: 5px; }
    .icon-starsgram img { padding: 3px; }

    @media (max-width: 360px) {
      .icon { width: 58px; height: 58px; border-radius: 12px; }
      .card-top { gap: 12px; }
    }

    .info h2 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 3px;
    }

    .info p {
      font-size: 13px;
      color: #8899a6;
      line-height: 1.35;
    }

    /* Button */
    .btn {
      display: block;
      width: 100%;
      text-align: center;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      color: #fff;
      border: none;
      transition: transform 0.15s, opacity 0.15s, box-shadow 0.2s;
      position: relative;
      overflow: hidden;
    }

    .btn:active {
      transform: scale(0.96);
      opacity: 0.9;
    }

    .btn-virus {
      background: #16a34a;
      box-shadow: 0 4px 14px rgba(22, 163, 74, 0.35);
    }

    .btn-virus:hover {
      box-shadow: 0 6px 20px rgba(22, 163, 74, 0.5);
    }

    .btn-rubup {
      background: #ca8a04;
      box-shadow: 0 4px 14px rgba(202, 138, 4, 0.35);
    }

    .btn-rubup:hover {
      box-shadow: 0 6px 20px rgba(202, 138, 4, 0.5);
    }

    .btn-stars {
      background: #2563eb;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    }

    .btn-stars:hover {
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Soft pulse on buttons */
    @keyframes softPulse {
      0%, 100% { box-shadow: 0 4px 14px rgba(22, 163, 74, 0.35); }
      50% { box-shadow: 0 4px 20px rgba(22, 163, 74, 0.55); }
    }

    .btn-virus {
      animation: softPulse 2.5s ease-in-out infinite;
    }


    /* Neon glass redesign */
    :root { color-scheme: dark; }
    body {
      background: radial-gradient(ellipse at 15% 10%, rgba(37,99,235,.20), transparent 38%),
                  radial-gradient(ellipse at 90% 85%, rgba(168,85,247,.17), transparent 40%), #070a12;
      overflow-x: hidden;
      isolation: isolate;
    }
    body::before, body::after {
      content: ""; position: fixed; width: 280px; height: 280px; border-radius: 50%;
      filter: blur(75px); opacity: .22; z-index: -1; pointer-events: none;
      animation: orbFloat 12s ease-in-out infinite alternate;
    }
    body::before { background:#2563eb; top:-110px; left:-100px; }
    body::after { background:#a855f7; bottom:-120px; right:-100px; animation-delay:-6s; }
    .wrap { max-width: 410px; position: relative; padding: 8px 0 18px; }
    .header { padding: 13px 14px; margin-bottom: 22px; border:1px solid rgba(255,255,255,.09);
      border-radius:20px; background:rgba(17,24,39,.66); backdrop-filter:blur(18px);
      box-shadow:0 12px 35px rgba(0,0,0,.18); }
    .back { background:linear-gradient(145deg,#202b43,#111827); border:1px solid rgba(255,255,255,.1); }
    .avatar { border:2px solid rgba(96,165,250,.7); box-shadow:0 0 16px rgba(59,130,246,.3); }
    .header-info h1 { letter-spacing:.2px; }
    .header-info span { display:inline-flex; align-items:center; gap:6px; }
    .header-info span::before { content:""; width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 10px #4ade80; }
    .card { position:relative; overflow:hidden; padding:19px; margin-bottom:14px;
      background:linear-gradient(145deg,rgba(24,33,54,.94),rgba(12,17,30,.94));
      border:1px solid rgba(148,163,184,.16); border-radius:22px;
      box-shadow:0 12px 30px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.045);
      backdrop-filter:blur(16px); transition:transform .28s ease,border-color .28s ease,box-shadow .28s ease; }
    .card::before { content:"";position:absolute;inset:0 18% auto;height:1px;
      background:linear-gradient(90deg,transparent,rgba(147,197,253,.45),transparent); }
    .card:hover { transform:translateY(-4px); border-color:rgba(96,165,250,.4);
      box-shadow:0 18px 40px rgba(0,0,0,.34),0 0 24px rgba(59,130,246,.10); }
    .card-top { margin-bottom:17px; }
    .icon { width:68px;height:68px;border-radius:18px;background:linear-gradient(145deg,#111b2f,#080d18);
      border:1px solid rgba(255,255,255,.16); box-shadow:0 0 0 4px rgba(255,255,255,.018),0 8px 24px rgba(0,0,0,.3);
      transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s ease; }
    .card:hover .icon { transform:translateY(-2px) rotate(-2deg) scale(1.035); }
    .icon-virus { box-shadow:0 0 20px rgba(34,197,94,.13),inset 0 0 18px rgba(34,197,94,.04); }
    .icon-rubup { box-shadow:0 0 20px rgba(250,204,21,.12),inset 0 0 18px rgba(250,204,21,.04); }
    .icon-starsgram { box-shadow:0 0 20px rgba(59,130,246,.16),inset 0 0 18px rgba(59,130,246,.04); }
    .info h2 { font-size:17px; letter-spacing:.15px; }
    .info p { color:#a4b2c8; line-height:1.5; }
    .btn { border:1px solid rgba(255,255,255,.14); border-radius:14px; padding:14px 16px;
      letter-spacing:.1px; box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 8px 20px rgba(0,0,0,.18);
      transition:transform .22s ease,filter .22s ease,box-shadow .22s ease; }
    .btn::after { content:"";position:absolute;top:-60%;left:-70%;width:45%;height:220%;
      transform:rotate(24deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);
      transition:left .55s ease; }
    .btn:hover::after { left:135%; }
    .btn:hover { transform:translateY(-2px);filter:brightness(1.1); }
    .btn:focus-visible { outline:2px solid #fff;outline-offset:3px; }
    .btn-virus { background:linear-gradient(110deg,#16a34a,#22c55e);box-shadow:0 0 22px rgba(34,197,94,.22); }
    .btn-rubup { background:linear-gradient(110deg,#a16207,#eab308);box-shadow:0 0 22px rgba(234,179,8,.17); }
    .btn-stars { background:linear-gradient(110deg,#1d4ed8,#3b82f6);box-shadow:0 0 22px rgba(59,130,246,.22); }
    .btn-virus:hover { box-shadow:0 0 28px rgba(34,197,94,.38); }
    .btn-rubup:hover { box-shadow:0 0 28px rgba(234,179,8,.32); }
    .btn-stars:hover { box-shadow:0 0 28px rgba(59,130,246,.38); }
    @keyframes orbFloat { from { transform:translate3d(0,0,0) scale(1); } to { transform:translate3d(45px,-25px,0) scale(1.18); } }
    @media (max-width:360px) { .header{padding:11px}.card{padding:16px}.icon{width:60px;height:60px;border-radius:15px} }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration:.01ms !important;animation-iteration-count:1 !important;scroll-behavior:auto !important;transition-duration:.01ms !important; } }

  </style>
